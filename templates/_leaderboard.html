<div class="leaderboard-box">
  <div class="leaderboard-header">
    <span class="leaderboard-title">🏆 Classement du serveur</span>
    <span class="leaderboard-subtitle">Les plus riches</span>
  </div>

  {% if leaderboard %}
    <ol class="leaderboard-list">
      {% for item in leaderboard %}
        <li class="leaderboard-item">
          <span class="leaderboard-rank">#{{ loop.index }}</span>
          <span class="leaderboard-user">{{ item.display_name }}</span>
          <span class="leaderboard-balance">
            {{ item.balance }}
            <img class="leaderboard-coin" src="{{ url_for('coin_image') }}" alt="pièces" />
          </span>
        </li>
      {% endfor %}
    </ol>
  {% else %}
    <p class="leaderboard-empty">Aucun solde enregistré pour le moment.</p>
  {% endif %}
</div>
