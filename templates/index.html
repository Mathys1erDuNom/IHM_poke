
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pokédex</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/style.css') }}?v=2"
  />
</head>

<body>

  <div class="device">

    <div class="device-header">
      <div class="lens-cluster">
        <span class="lens lens-big"></span>
        <span class="lens lens-small lens-red"></span>
        <span class="lens lens-small lens-yellow"></span>
        <span class="lens lens-small lens-green"></span>
      </div>

      <h1 class="brand">Pokédex</h1>
    </div>

    <div class="screen">

      <div class="screen-topline">
        <span>Bienvenue</span>
      </div>

      <div class="screen-body">

        <div class="home-content">

          <h2 class="home-title">
            Pokédex des dresseurs
          </h2>

          <p class="home-description">
            Consulte les collections des différents dresseurs.
          </p>

          <form action="{{ url_for('pokedex') }}" method="get">
              <button type="submit" class="pokedex-button">
                  📖 Ouvrir le Pokédex
              </button>
          </form>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
