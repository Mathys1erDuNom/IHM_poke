<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokédex des dresseurs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Pokédex des dresseurs</h1>
    <input id="filter-input" type="text" placeholder="Filtrer par nom de Pokémon (tous dresseurs)" />
  </header>

  <main class="content">
    <p id="loading-state" class="muted">Chargement des collections…</p>
    <p id="empty-state" class="empty-state" hidden>Aucune collection ne correspond à ce filtre.</p>
    <div id="collections"></div>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
